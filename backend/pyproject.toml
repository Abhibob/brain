[project]
name = "edutrack-backend"
version = "0.1.0"
description = "FastAPI backend for EduTrack adaptive learning platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.0",
  "aiosqlite>=0.21.0",
  "asyncpg>=0.31.0",
  "bcrypt>=4.0,<4.1",
  "celery>=5.6.0",
  "email-validator>=2.3.0",
  "fastapi>=0.125.0",
  "httpx>=0.28.0",
  "numpy>=2.3.0",
  "openai>=2.0.0",
  "pandas>=2.3.0",
  "passlib[bcrypt]>=1.7.4",
  "pgvector>=0.4.0",
  "pydantic-settings>=2.12.0",
  "python-jose[cryptography]>=3.5.0",
  "redis>=7.0.0",
  "scikit-learn>=1.8.0",
  "sqlalchemy[asyncio]>=2.0.45",
  "tiktoken>=0.12.0",
  "uvicorn[standard]>=0.38.0",
  "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
